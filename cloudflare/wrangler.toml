name = "hosthub-admin-router"
main = "src/worker.js"
compatibility_date = "2026-02-18"
workers_dev = true

# NOTE: the admin route is NOT hardcoded here anymore. It is injected at deploy
# time by deploy_hosthub.sh via `--route`, generated from HOSTHUB_PUBLIC_DOMAIN +
# HOSTHUB_ADMIN_PATH (single source of truth, set in the env file). To move the
# admin console to a new domain, change those env vars — no edit here.
# Current: admin.trysilpanorama.com/*  (zone trysilpanorama.com)

[assets]
directory = "../hosthub_console/build/web"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[vars]
# Use root path on admin subdomain.
HOSTHUB_ADMIN_PATH = "/"
